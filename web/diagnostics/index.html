<h1>读取 FM-1 的实际性能</h1>
<p>适用 0.4.7-rc1 及更新版本。接上 USB，用 Chrome 或 Edge 连接 MIDI 输入与输出，采集期间照常演奏、换音色、切页面。数据来自设备自身的计时器与断流计数。</p>
<button id="connect">连接设备</button>
<div id="ports" hidden><label>MIDI 输入<select id="input"></select></label><label>MIDI 输出<select id="output"></select></label>
<div class="actions"><button id="capture">采集 10 秒性能</button><a id="download" hidden download="OpenIFW-FM1-performance.json">下载性能报告</a></div></div>
<p id="status" role="status" aria-live="polite">连接后可以采集，不会更改设备音色或设置。</p><progress id="progress" value="0" max="20" hidden></progress>
<table id="result" hidden><thead><tr><th>指标</th><th>设备读数</th></tr></thead><tbody id="rows"></tbody></table>
<details><summary>原始数据</summary><pre id="raw"></pre></details>
<small>XRUN 表示完整音频中断超时，DMA / missed commit 表示未能安全提交新音频，CLIP 表示数值触顶。扫描与 USB 计时可能包含在音频中断计时内，不能相加作为 CPU 占用。</small>
<script type="module" src="./diagnostics.js?v=0.4.7-rc1"></script></main></html>
